[package]
name = "pi-desktop"
version = "0.1.0"
description = "pi coding agent in una finestra desktop"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls", "connect"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
